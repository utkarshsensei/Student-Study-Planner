<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasks - Study Planner</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
<li class="nav-item ms-lg-3">

    <button
        class="btn btn-outline-light btn-sm mt-1"
        onclick="toggleDarkMode()">

        🌙 Dark Mode

    </button>

</li>
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                📚 Study Planner
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="subjects.html">
                            Subjects
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tasks.html">
                            Tasks
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="timetable.html">
                            Timetable
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="exams.html">
                            Exams
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Main Content -->
    <div class="container mt-5">

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="fw-bold">
                    My Tasks
                </h1>

                <p class="text-muted">
                    Manage your study tasks and deadlines.
                </p>

            </div>

            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#taskModal">

                + Add Task

            </button>

        </div>


        <!-- Task Card -->
        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>

                            <tr>
                                <th>Task</th>
                                <th>Subject</th>
                                <th>Deadline</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody id="taskList">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- Add Task Modal -->

    <div class="modal fade" id="taskModal">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Add New Task
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <form id="taskForm">

                        <!-- Task Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Task Name
                            </label>

                            <input type="text"
                                   id="taskName"
                                   class="form-control"
                                   placeholder="Enter task name"
                                   required>

                        </div>


                        <!-- Subject -->

                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <select id="taskSubject"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Subject
                                </option>

                                <option>
                                    Data Structures
                                </option>

                                <option>
                                    DBMS
                                </option>

                                <option>
                                    Machine Learning
                                </option>

                                <option>
                                    Web Development
                                </option>

                                <option>
                                    Computer Networks
                                </option>

                                <option>
                                    Operating Systems
                                </option>

                            </select>

                        </div>


                        <!-- Deadline -->

                        <div class="mb-3">

                            <label class="form-label">
                                Deadline
                            </label>

                            <input type="date"
                                   id="taskDeadline"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- Priority -->

                        <div class="mb-3">

                            <label class="form-label">
                                Priority
                            </label>

                            <select id="taskPriority"
                                    class="form-select">

                                <option value="High">
                                    High
                                </option>

                                <option value="Medium">
                                    Medium
                                </option>

                                <option value="Low">
                                    Low
                                </option>

                            </select>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">

                            Add Task

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Our JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
